[package]
name = "lazyui-ratatui"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
description = "Lazygit-style panels for Ratatui: rounded windows named with their focus key, corner notes, arrows between windows, scrolling one-line fields"
license = "Apache-2.0"
repository = "https://github.com/lutianyu2001/lazyui-ratatui"
documentation = "https://docs.rs/lazyui-ratatui"
readme = "README.md"
keywords = ["ratatui", "lazygit", "tui", "widget", "panel"]
categories = ["command-line-interface"]
# What the security audit keeps in the repository, and what only the repository's tools read.
exclude = [
    "audit/",
    "supply-chain/",
    ".cargo/",
    ".github/",
    ".gitignore",
    "clippy.toml",
    "deny.toml",
    "rustfmt.toml",
    "SECURITY.md",
    "SUPPLY_CHAIN.md",
]

[workspace]
members = [".", "xtask"]
exclude = ["fuzz"]

[dependencies]
ratatui = { version = "0.30.2", default-features = false }
unicode-segmentation = "1.13.3"

[lints.rust]
unsafe_code = "forbid"
unsafe_op_in_unsafe_fn = "deny"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }

[lints.clippy]
pedantic = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
# Overflowing u16 coordinates would panic in a debug build and draw in the wrong place in a
# release one, so arithmetic says how it handles overflow.
arithmetic_side_effects = "deny"
# #[must_use] on every builder method and getter is more noise than help here.
must_use_candidate = "allow"
return_self_not_must_use = "allow"

[dev-dependencies]
proptest = "1.12.0"

# Only what this workspace builds: a library's users set their own.
[profile.release]
overflow-checks = true
