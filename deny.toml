# The dependency part of the security audit (see SECURITY.md): cargo xtask deny.

[advisories]
unmaintained = "all"
yanked = "deny"

[licenses]
# Only those in the dependency tree; when a dependency goes, what only it used goes too.
allow = ["Apache-2.0", "MIT", "Unicode-3.0", "Zlib"]

[bans]
multiple-versions = "warn"
wildcards = "deny"
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
